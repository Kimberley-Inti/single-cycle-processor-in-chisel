name: Continuous Integration

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Compile and run all tests
        run: sbt clean test
      - name: Generate processor RTL
        run: sbt "runMain Core.Generate examples/integration.hex generated"
      - name: Check the top-level interface
        run: grep -q 'io_pr_out_pc' generated/Top.v
      - name: Check ELF conversion script
        run: |
          bash -n src/shell/tohex.sh
          printf '\023\000\000\000' > generated/sample.bin
          printf '#!/usr/bin/env bash\ncp "$3" "$4"\n' > generated/mock-objcopy
          chmod +x generated/mock-objcopy
          OBJCOPY="$PWD/generated/mock-objcopy" bash src/shell/tohex.sh generated/sample.bin generated/sample.hex
          printf '13\n00\n00\n00\n' > generated/expected.hex
          diff -u generated/expected.hex generated/sample.hex
